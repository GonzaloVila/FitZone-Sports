openapi: 3.0.3
info:
  title: FitZone Sports API — Primera REST API
  description: >
    Contrato OpenAPI de la primera versión de la API REST del backend de FitZone Sports
    (Unidad II · SCRUM-11c · lotes L1–L6). Organizado por entidad: cada recurso expone
    los verbos que el caso contempla — POST/GET/PATCH en usuarios, socios y membresías;
    GET/POST en sedes, canchas y clases (PATCH de cancha para RF-09/RF-12). Las reservas
    son dos entidades aparte, espejo del modelo (ReservaCancha y ReservaClase): los turnos
    de cancha en /reservas-canchas (RF-10/RF-12/RN-02) y el cupo de clase en /reservas-clases
    (RF-06, con cancelación por RF-07). Convenciones: prefijo /api/v1, nivel 2 de Richardson,
    errores como application/problem+json (RFC 9457), Location en 201 e Idempotency-Key en pagos.
    Sin DELETE de usuarios/sedes/canchas/clases (el caso no lo pide): la "baja" de una reserva
    es su cancelación (sub-recurso) y dejar de ser socio es DELETE /socios (vuelve a EXTERNO).
    Pago no tiene PATCH/DELETE: un cobro mal hecho se ANULA y se repaga con nueva
    Idempotency-Key (nunca se edita el comprobante). security vacío porque la autenticación
    (JWT) se incorpora en la Unidad III. Los cambios de estado no van por PATCH: el path
    nombra la transición permitida, así las ilegales son inalcanzables. Las transiciones de
    estado usan sustantivo plural — /cancelaciones, /anulaciones, /confirmaciones. El egreso
    es la única excepción, en verbo (/ingresos/{ingreso_id}/egreso), porque es la segunda fase
    del ciclo de vida de un ingreso y no una transición de estado. Un POST que crea un recurso
    devuelve 201 con Location y cuerpo; uno que solo cambia estado y no crea nada devuelve 204.
    Los listados excluyen los estados terminales salvo que se pidan explícitamente con ?estado=.
  version: "1.0.0"
  license:
    name: Académico — TFI FitZone Sports (UNVM)
    url: https://github.com/GonzaloVila/FitZone-Sports
servers:
  - url: http://localhost:3000/api/v1
    description: Local (prefijo global api/v1)
tags:
  - name: usuarios
    description: Usuarios y perfiles (M1)
  - name: socios
    description: Socios y su sede de origen (M1)
  - name: membresias
    description: Membresías (1:1 con socio, sin historial) (M1)
  - name: sedes
    description: Sedes de la cadena (M2)
  - name: canchas
    description: Canchas y disponibilidad (M4)
  - name: clases
    description: Clases (M3)
  - name: reservas-canchas
    description: Reservas de turnos de cancha (M4)
  - name: reservas-clases
    description: Reservas de cupo de clase (M3)
  - name: pagos
    description: Pagos y comprobantes (M5)
paths:
  # ---------------------------------------------------------------- USUARIOS
  /usuarios:
    get:
      tags: [usuarios]
      operationId: listarUsuarios
      summary: Listado de usuarios con filtros
      description: >
        Filtros por rol, nombre y email (lista blanca de parámetros) y paginación.
      parameters:
        - name: rol
          in: query
          required: false
          description: Rol del usuario. Sin filtro devuelve todos los roles.
          schema:
            $ref: "#/components/schemas/Rol"
        - name: nombre
          in: query
          required: false
          description: coincidencia parcial sobre el nombre.
          schema:
            type: string
          example: Ana
        - name: email
          in: query
          required: false
          description: Email exacto (es único en el esquema).
          schema:
            type: string
            format: email
          example: ana.gomez@fitzone.com.ar
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Listado de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioOut"
              example:
                - id: 1
                  rol: EXTERNO
                  dni: "35123456"
                  nombre: "Ana Gómez"
                  email: ana.gomez@fitzone.com.ar
                  telefono: "+54 351 555-1234"
                  foto_url: https://cdn.fitzone.com.ar/fotos/ana.jpg
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [usuarios]
      operationId: crearUsuario
      summary: Registrar usuario
      description: >
        Alta de usuario distinguiendo el rol de perfil (EXTERNO | RECEPCION | GERENTE).
        DNI y email son únicos. La contrasenia se guarda hasheada (bcrypt), nunca en texto plano.
        Un usuario NO se crea como SOCIO acá: hacerse socio es POST /socios, que lo convierte
        y crea su membresía inicial. Responde 201 con el header Location apuntando al recurso creado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioIn"
      responses:
        "201":
          description: Usuario registrado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/usuarios/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioOut"
              example:
                id: 1
                rol: EXTERNO
                dni: "35123456"
                nombre: "Ana Gómez"
                email: ana.gomez@fitzone.com.ar
                telefono: "+54 351 555-1234"
                foto_url: https://cdn.fitzone.com.ar/fotos/ana.jpg
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    get:
      tags: [usuarios]
      operationId: obtenerUsuario
      summary: Obtener usuario por id
      description: Devuelve el perfil del usuario (sin datos de contraseña). Si no existe, 404.
      responses:
        "200":
          description: Perfil del usuario (sin datos de contraseña)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioOut"
              example:
                id: 1
                rol: SOCIO
                dni: "35123456"
                nombre: "Ana Gómez"
                email: ana.gomez@fitzone.com.ar
                telefono: "+54 351 555-1234"
                foto_url: https://cdn.fitzone.com.ar/fotos/ana.jpg
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [usuarios]
      operationId: modificarUsuario
      summary: Modificar parcialmente un usuario
      description: >
        Actualización parcial de contacto, foto y/o contraseña (contrasenia se hashea).
        Campos ausentes en el body no se modifican. Si el id no existe, responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioPatch"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioOut"
              example:
                id: 1
                rol: SOCIO
                dni: "35123456"
                nombre: "Ana Gómez"
                email: ana.gomez@fitzone.com.ar
                telefono: "+54 351 555-1234"
                foto_url: https://cdn.fitzone.com.ar/fotos/ana.jpg
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  # ---------------------------------------------------------------- SOCIOS
  /socios:
    get:
      tags: [socios]
      operationId: listarSocios
      summary: Listado de socios con filtros
      description: >
        Filtros por sede de origen, estado y plan de la membresía, y por nombre
        (lista blanca de parámetros) y paginación. `estado_membresia` y `plan` cruzan la
        relación 1:1 a la membresía del socio. Sin ningún filtro devuelve todos los socios
        de la cadena.
      parameters:
        - name: sede_origen_id
          in: query
          required: false
          description: ID numérico de la sede de origen
          schema:
            type: integer
          example: 3
        - name: estado_membresia
          in: query
          required: false
          description: Estado de la membresía asociada al socio.
          schema:
            $ref: "#/components/schemas/EstadoMembresia"
        - name: plan
          in: query
          required: false
          description: Plan de la membresía asociada al socio.
          schema:
            $ref: "#/components/schemas/Plan"
        - name: nombre
          in: query
          required: false
          description: coincidencia parcial sobre el nombre del usuario asociado.
          schema:
            type: string
          example: Ana
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Listado de socios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocioOut"
              example:
                - id: 2
                  usuario_id: 1
                  sede_origen_id: 3
                  fecha_alta: "2026-09-15T00:00:00-03:00"
                  nombre: "Ana Gómez"
                  email: ana.gomez@fitzone.com.ar
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [socios]
      operationId: crearSocio
      summary: Alta de socio (RF-02)
      description: >
        Convierte al usuario en socio (subtabla Socio) indicando su sede de origen y crea
        la membresía inicial con el plan enviado, en la misma transacción: no existe un
        socio sin membresía. Un usuario que ya es socio responde 409. Lo inverso es
        DELETE /socios/{id} (dejar de ser socio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocioIn"
      responses:
        "201":
          description: Socio creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/socios/2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocioOut"
              example:
                id: 2
                usuario_id: 1
                sede_origen_id: 3
                fecha_alta: "2026-09-15T00:00:00-03:00"
                nombre: "Ana Gómez"
                email: ana.gomez@fitzone.com.ar
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SocioExistente"
        "422":
          $ref: "#/components/responses/ValidationError"
  /socios/{socio_id}:
    parameters:
      - $ref: "#/components/parameters/SocioId"
    get:
      tags: [socios]
      operationId: obtenerSocio
      summary: Obtener socio por id
      description: Devuelve el perfil del socio junto con su sede de origen y fecha de alta.
      responses:
        "200":
          description: Perfil del socio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocioOut"
              example:
                id: 2
                usuario_id: 1
                sede_origen_id: 3
                fecha_alta: "2026-09-15T00:00:00-03:00"
                nombre: "Ana Gómez"
                email: ana.gomez@fitzone.com.ar
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [socios]
      operationId: modificarSocio
      summary: Modificar parcialmente un socio
      description: Actualización parcial (por ejemplo, la sede de origen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocioPatch"
      responses:
        "200":
          description: Socio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocioOut"
              example:
                id: 2
                usuario_id: 1
                sede_origen_id: 3
                fecha_alta: "2026-09-15T00:00:00-03:00"
                nombre: "Ana Gómez"
                email: ana.gomez@fitzone.com.ar
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [socios]
      operationId: dejarDeSerSocio
      summary: Dejar de ser socio
      description: >
        "Dar de baja un socio" equivale a dejar de ser socio: se elimina su fila en la
        subtabla Socio (y la membresía, relación 1:1) y el usuario vuelve a rol EXTERNO.
        El historial de reservas y pagos se conserva: referencia al usuario, no a la subtabla.
        Un socio inexistente responde 404.
      responses:
        "204":
          description: Deja de ser socio (sin cuerpo)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  # ---------------------------------------------------------------- MEMBRESIAS
  /socios/{socio_id}/membresias:
    parameters:
      - $ref: "#/components/parameters/SocioId"
    get:
      tags: [membresias]
      operationId: obtenerMembresia
      summary: Membresía actual del socio
      description: >
        Devuelve la membresía vigente del socio (relación 1:1, sin historial).
        Todo socio tiene membresía desde su alta, así que el 404 es solo por socio
        inexistente.
      responses:
        "200":
          description: Membresía del socio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembresiaOut"
              example:
                id: 9
                plan: MENSUAL
                estado: ACTIVA
                fecha_inicio: "2026-09-15T00:00:00-03:00"
                fecha_fin: "2026-10-15T00:00:00-03:00"
                renueva_automatica: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [membresias]
      operationId: modificarMembresia
      summary: Cambiar plan o configuración de la membresía
      description: >
        Cambio de plan, renovación automática y/o estado sobre la misma fila (1:1, sin historial).
        Frenar la renovación = renueva_automatica:false; suspender = estado:SUSPENDIDA.
        La fecha_fin se recalcula sobre la fecha actual según el nuevo plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembresiaPatch"
      responses:
        "200":
          description: Membresía actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembresiaOut"
              example:
                id: 9
                plan: MENSUAL
                estado: ACTIVA
                fecha_inicio: "2026-09-15T00:00:00-03:00"
                fecha_fin: "2026-10-15T00:00:00-03:00"
                renueva_automatica: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  # ---------------------------------------------------------------- SEDES
  /sedes:
    get:
      tags: [sedes]
      operationId: listarSedes
      summary: Listado de sedes
      description: Listado paginado de todas las sedes de la cadena (Gerente Central, A4). Solo admite paginación (lista blanca de parámetros).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Listado de sedes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SedeOut"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [sedes]
      operationId: crearSede
      summary: Alta de sede
      description: >
        Alta de una nueva sucursal por el Gerente Central (RNF-04). La sede queda disponible
        para canchas, clases y control de acceso en forma inmediata (configuración por BD).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SedeIn"
      responses:
        "201":
          description: Sede creada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/sedes/3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SedeOut"
        "422":
          $ref: "#/components/responses/ValidationError"
  # ------------------------------------------- M2 · INGRESOS Y AFORO (RF-04/RF-05)
  /ingresos:
    get:
      tags: [ingresos]
      operationId: listarIngresos
      summary: Listado de ingresos a sede con filtros
      description: >
        Filtros por sede, usuario y día (lista blanca de parámetros) y paginación.
        `dentro=true` devuelve solo los ingresos sin egreso, es decir los usuarios que
        siguen en la sede; es el detalle que /sedes/{sede_id}/aforo no da porque ese solo
        devuelve el número de occupants (RN-01).
      parameters:
        - name: sede_id
          in: query
          required: false
          description: ID numérico de la sede
          schema:
            type: integer
          example: 3
        - name: usuario_id
          in: query
          required: false
          description: ID numérico del usuario que ingresó
          schema:
            type: integer
          example: 2
        - name: fecha
          in: query
          required: false
          description: Día consultado (YYYY-MM-DD, hora local de la sede).
          schema:
            type: string
            format: date
          example: "2026-09-16"
        - name: dentro
          in: query
          required: false
          description: true trae solo los ingresos con fecha_hora_egreso nula (aún en la sede).
          schema:
            type: boolean
          example: true
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Listado de ingresos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngresoOut"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [ingresos]
      operationId: registrarIngreso
      summary: Registrar ingreso a la sede (RF-04)
      description: >
        Registra el turno de acceso. Valida que el usuario tenga una membresía vigente
        (RF-04: estado distinto de SUSPENDIDA y fecha_fin no vencida) y que la sede tenga
        espacio (RF-05, cuenta los Ingresos sin egreso contra
        Sede.aforo_maximo). RN-01: un usuario no puede estar dentro de dos sedes a la vez;
        si ya tiene un ingreso sin egreso responde 409 (acceso-duplicado). El qr_token
        está en el contrato como revisable: la vigencia/rotación del QR se define en la
        Unidad III. fecha_hora_ingreso es opcional para el puesto de control offline
        (RNF-01): enviar la hora real del acceso cuando se sincroniza.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoIn"
      responses:
        "201":
          description: Ingreso registrado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/ingresos/9
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngresoOut"
        "403":
          $ref: "#/components/responses/MembresiaInactiva"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictoAcceso"
        "422":
          $ref: "#/components/responses/ValidationError"
  /ingresos/{ingreso_id}:
    parameters:
      - $ref: "#/components/parameters/IngresoId"
    get:
      tags: [ingresos]
      operationId: obtenerIngreso
      summary: Obtener ingreso por id
      description: >
        Devuelve el registro del acceso. `fecha_hora_egreso` es nula mientras el usuario
        permanezca dentro de la sede (es lo que define el aforo, RN-01). Para el egreso
        ver POST /ingresos/{ingreso_id}/egreso.
      responses:
        "200":
          description: Registro de ingreso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngresoOut"
        "404":
          $ref: "#/components/responses/NotFound"
  /ingresos/{ingreso_id}/egreso:
    parameters:
      - $ref: "#/components/parameters/IngresoId"
    post:
      tags: [ingresos]
      operationId: registrarEgreso
      summary: Registrar egreso de la sede (RF-05)
      description: >
        Cierra el turno de acceso escribiendo fecha_hora_egreso: libera el cupo de aforo
        (RF-05). Modelado como sub-recurso y sin body al igual que las cancelaciones.
        Un acceso ya egresado responde 409 (egreso-duplicado); un ingreso inexistente, 404.
      responses:
        "204":
          description: Egreso registrado (sin cuerpo)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EgresoDuplicado"
  /sedes/{sede_id}/aforo:
    parameters:
      - $ref: "#/components/parameters/SedeId"
    get:
      tags: [sedes]
      operationId: obtenerAforo
      summary: Aforo actual de una sede (RF-05)
      description: >
        aforo_actual = cantidad de Ingresos sin fecha_hora_egreso de la sede (RN-01);
        restante = aforo_maximo - aforo_actual. Es la misma cuenta que valida cada
        POST de acceso.
      responses:
        "200":
          description: Aforo actual de la sede
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AforoOut"
        "404":
          $ref: "#/components/responses/NotFound"
  # ---------------------------------------------------------------- CANCHAS
  /sedes/{sede_id}/canchas:
    parameters:
      - $ref: "#/components/parameters/SedeId"
    get:
      tags: [canchas]
      operationId: listarCanchas
      summary: Listado de canchas de una sede
      description: Listado paginado de las canchas de la sede (incluye las no operativas, RF-12); opcional filtrar por ?estado= (lista blanca de parámetros). Sin ?estado= devuelve todas, incluidas las EN_MANTENIMIENTO.
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtro por estado (OPERATIVA | EN_MANTENIMIENTO). Si se omite, devuelve ambas.
          schema:
            $ref: "#/components/schemas/EstadoCancha"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Listado de canchas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanchaOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [canchas]
      operationId: crearCancha
      summary: Alta de cancha (RF-09)
      description: El Gerente configura el tipo y el costo por hora (por defecto, operativa).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanchaIn"
      responses:
        "201":
          description: Cancha creada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/sedes/3/canchas/6
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanchaOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /canchas/{cancha_id}:
    parameters:
      - $ref: "#/components/parameters/CanchaId"
    get:
      tags: [canchas]
      operationId: obtenerCancha
      summary: Obtener cancha por id
      responses:
        "200":
          description: Cancha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanchaOut"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [canchas]
      operationId: modificarCancha
      summary: Modificar parcialmente una cancha
      description: >
        Actualiza costo_por_hora (RF-09) y/o estado. Pasar a EN_MANTENIMIENTO no borra las
        reservas ya tomadas (RF-12): inhabilitar el futuro no toca el histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanchaPatch"
      responses:
        "200":
          description: Cancha actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanchaOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /canchas/{cancha_id}/disponibilidad:
    parameters:
      - $ref: "#/components/parameters/CanchaId"
    get:
      tags: [canchas]
      operationId: consultarDisponibilidad
      summary: Disponibilidad de turnos de una cancha
      description: >
        Consulta indexada por día (RNF-03). Devuelve los tramos horarios libres/ocupados
        para la fecha solicitada. Si la cancha está EN_MANTENIMIENTO todos los tramos
        responden disponible:false (RF-12): se bloquea el futuro sin tocar las reservas ya tomadas.
        La consulta usa el índice compuesto (cancha_id, fecha_hora_inicio). Solo admite
        ?fecha= y paginación (lista blanca de parámetros).
      parameters:
        - name: fecha
          in: query
          required: true
          description: Día consultado (YYYY-MM-DD, hora local de la sede).
          schema:
            type: string
            format: date
            example: "2026-09-16"
        # La descripción de esta operación ya decía "Solo admite ?fecha= y paginación",
        # pero faltaban los dos $ref de paginación. Se agregan para que la lista
        # blanca y la prosa digan lo mismo.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Disponibilidad del día
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DisponibilidadEntrada"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  # ---------------------------------------------------------------- CLASES
  /clases:
    get:
      tags: [clases]
      operationId: listarClases
      summary: Listado de clases con filtros
      description: Filtrado por tipo y/o sede (lista blanca de parámetros) y paginación.
      parameters:
        - name: tipo
          in: query
          required: false
          description: Tipo de clase (libre; ej. Spinning, Yoga).
          schema:
            type: string
        - name: sede_id
          in: query
          required: false
          description: ID numérico de la sede
          schema:
            type: integer
            example: 3
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Listado de clases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaseOut"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [clases]
      operationId: crearClase
      summary: Alta de clase (RF-06)
      description: Registra una clase con su tipo, instructor, horario y capacidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaseIn"
      responses:
        "201":
          description: Clase creada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/clases/4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaseOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ClaseFueraDeHorario"
        "422":
          $ref: "#/components/responses/ValidationError"
  /clases/{clase_id}:
    parameters:
      - $ref: "#/components/parameters/ClaseId"
    get:
      tags: [clases]
      operationId: obtenerClase
      summary: Obtener clase por id
      description: Devuelve la clase con los cupos libres restantes ahora. Si no existe, 404.
      responses:
        "200":
