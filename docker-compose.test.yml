# Postgres efímero solo para los tests de integración y de API. No usar para
# desarrollo normal (para eso seguimos usando la Supabase compartida vía .env).
#
# - Los datos viven en memoria (tmpfs): cada vez que el contenedor se recrea
#   arranca vacío, así que después de levantarlo hay que aplicar las migraciones.
# - No arranca solo con Docker Desktop (restart: "no"): se levanta cuando se testea.
# - El healthcheck permite esperar a que acepte conexiones con `up --wait`.
#
# Uso (desde backend/):
#   npm run test:db:up        # levanta el contenedor y espera a que esté sano
#   npm run test:db:migrate   # aplica las migraciones con backend/.env.test
#   npm run test:integration
#
# Sin los scripts:
#   docker compose -f docker-compose.test.yml up -d --wait
#   DATABASE_URL="postgresql://fitzone:fitzone@localhost:55432/fitzone_test" \
#     npx prisma migrate deploy --schema prisma/schema.prisma
#
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: fitzone-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: fitzone
      POSTGRES_PASSWORD: fitzone
      POSTGRES_DB: fitzone_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitzone -d fitzone_test"]
      interval: 2s
      timeout: 3s
      retries: 15
