# Postgres efímero solo para tests e2e. No usar para desarrollo normal
# (para eso seguimos usando la Supabase compartida vía .env).
#
# Uso:
#   docker compose -f docker-compose.test.yml up -d
#   npx prisma migrate deploy --schema prisma/schema.prisma
#   npx vitest run --config vitest.e2e.config.ts
#
# O para correr todo de una:
#   docker compose -f docker-compose.test.yml up -d && \
#     DATABASE_URL="postgresql://fitzone:fitzone@localhost:5432/fitzone_test" \
#     npx prisma migrate deploy --schema prisma/schema.prisma && \
#     npx vitest run --config vitest.e2e.config.ts
#
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: fitzone-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitzone
      POSTGRES_PASSWORD: fitzone
      POSTGRES_DB: fitzone_test
    ports:
      - "5432:5432"
    volumes:
      - fitzone_test_data:/var/lib/postgresql/data

volumes:
  fitzone_test_data:
