        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        renuevaAutomatica:
          type: boolean
      example:
        id: 9
        plan: MENSUAL
        estado: ACTIVA
        fechaInicio: '2026-09-15T00:00:00-03:00'
        fechaFin: '2026-10-15T00:00:00-03:00'
