    LoginIn:
      type: object
      required:
        - email
        - contrasenia
      properties:
        email:
          type: string
          format: email
          example: recepcion@sede5.fitzone.com
        contrasenia:
          type: string
          writeOnly: true
          description: Contraseña en claro; se compara contra el hash guardado en el alta.
          example: miPassword123
      additionalProperties: false
    LoginOut:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - rol
        - usuarioId
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Segundos hasta el vencimiento del token.
          example: 900
        rol:
          type: string
          example: RECEPCION
        usuarioId:
          type: number
          description: ID del usuario autenticado (clave de Usuario).
          example: 7
        sedeId:
          type: number
          description: Sucursal de trabajo. Solo presente para rol RECEPCION.
          example: 5
        socioId:
          type: number
          description: ID del socio. Solo presente para rol SOCIO (se usa en POST /ingresos).
          example: 12
        refreshToken:
          type: string
          description: >
            Refresh token. Solo se incluye para clientes móviles (header `X-Cliente: movil`); los clientes web lo reciben en la cookie HttpOnly `refresh_token` y no en el body.
          example: k3J9x0Qm1c8eT5vWbN2yHq7LpR4sUaZdFgXo6iJwEtM
    RefreshIn:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: >
            Refresh token. Lo manda el cliente móvil, que lo recibió en el body del login. Si se omite, se lee de la cookie `refresh_token`; si vienen los dos, manda el body.
          example: k3J9x0Qm1c8eT5vWbN2yHq7LpR4sUaZdFgXo6iJwEtM
      additionalProperties: false
    RegistroQrOut:
      type: object
      required:
        - qrUri
        - mensaje
      properties:
        qrUri:
          type: string
          description: URI del QR a escanear con una app TOTP (Google Authenticator, Authy, etc.).
          example: otpauth://totp/FitZone:socio@email.com?secret=JBSWY3DPEHPK3PXP&issuer=FitZone
        mensaje:
          type: string
          example: Escaneá el QR con tu app de autenticación
    BloqueadoItemOut:
      type: object
      required:
        - socioId
        - motivo
        - desde
      properties:
        socioId:
          type: integer
          example: 123
        motivo:
          type: string
          enum:
            - VENCIDA
            - SUSPENDIDA
          example: VENCIDA
        desde:
          type: string
          description: Desde cuándo dejó de ser vigente.
          example: '2026-10-03T00:00:00Z'
    BloqueadosOut:
      type: object
      required:
        - bloqueados
        - total
        - servidorTime
      properties:
        bloqueados:
          type: array
          items:
            $ref: '#/components/schemas/BloqueadoItemOut'
        total:
          type: integer
          example: 2
        servidorTime:
          type: string
          description: Hora del servidor al responder.
          example: '2026-10-03T03:05:00Z'
    Rol:
      type: string
      enum:
        - SOCIO
        - EXTERNO
        - RECEPCION
        - GERENTE
    UsuarioIn:
      type: object
      required:
        - rol
        - dni
        - nombre
        - email
        - contrasenia
      properties:
        rol:
          type: string
          enum:
            - EXTERNO
            - RECEPCION
            - GERENTE
          description: 'Rol de perfil al crear. SOCIO no aplica acá: solo por POST /socios.'
        dni:
          type: string
          minLength: 7
          maxLength: 20
          pattern: ^\d+$
          example: '35123456'
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          example: Ana Gómez
        email:
          type: string
          format: email
          maxLength: 254
          example: ana.gomez@fitzone.com.ar
        contrasenia:
          type: string
          minLength: 8
          writeOnly: true
          description: Contraseña en claro al momento del alta; el servidor la hashea y no la devuelve nunca.
          example: Clave-Segura-123
        sedeId:
          type: integer
          minimum: 1
          description: >
            Sede de trabajo del recepcionista (A3). Obligatoria cuando `rol` es RECEPCION y prohibida para
            EXTERNO y GERENTE (422). Se guarda en `EmpleadoSede`, no en `Usuario`; como la sede es única en esa
            tabla, una sede admite a lo sumo un recepcionista.
          example: 5
        telefono:
          type: string
          maxLength: 20
          example: +54 351 555-1234
        fotoUrl:
          type: string
          example: https://cdn.fitzone.com.ar/fotos/ana.jpg
      additionalProperties: false
    UsuarioPatch:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        telefono:
          type: string
          nullable: true
          maxLength: 20
        fotoUrl:
          type: string
          nullable: true
        contrasenia:
          type: string
          minLength: 8
          writeOnly: true
          description: Nueva contraseña; el servidor la hashea.
      additionalProperties: false
    UsuarioOut:
      type: object
      required:
        - id
        - rol
        - dni
        - nombre
        - email
      properties:
        id:
          type: integer
        rol:
          $ref: '#/components/schemas/Rol'
        dni:
          type: string
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        fotoUrl:
          type: string
          nullable: true
        sedeId:
          type: integer
          nullable: true
          description: >-
            Sede de trabajo del recepcionista (EmpleadoSede, A3). Null en los demás roles y en un
            recepcionista que todavía no fue asignado. Es de solo lectura: se define al crear el usuario.
      example:
        id: 1
        rol: SOCIO
        dni: '35123456'
        nombre: Ana Gómez
        email: ana.gomez@fitzone.com.ar
        telefono: +54 351 555-1234
        fotoUrl: https://cdn.fitzone.com.ar/fotos/ana.jpg
        sedeId: null
    SocioIn:
      type: object
      required:
        - usuarioId
        - sedeOrigenId
        - plan
      properties:
        usuarioId:
          type: integer
          minimum: 1
          description: Usuario a convertir en socio (RF-01 ya lo contempla como Socio).
        sedeOrigenId:
          type: integer
          minimum: 1
          description: Sede de origen (información; el acceso multi-sede lo garantiza la membresía, RF-03).
        plan:
          type: string
          enum:
            - MENSUAL
            - TRIMESTRAL
            - ANUAL
          description: >
            Plan de la membresía inicial, obligatorio: no existe un socio sin membresía. El alta del socio crea la fila única de Membresia en la misma transacción (1:1) y la fecha_fin se calcula en el
            dominio a partir de este plan.
      additionalProperties: false
    SocioPatch:
      type: object
      properties:
        sedeOrigenId:
          type: integer
      additionalProperties: false
    SocioOut:
      type: object
      required:
        - id
        - usuarioId
        - sedeOrigenId
        - fechaAlta
        - nombre
        - email
      properties:
        id:
          type: integer
        usuarioId:
          type: integer
        sedeOrigenId:
          type: integer
        fechaAlta:
          type: string
          format: date-time
        nombre:
          type: string
          description: Se resuelve desde el Usuario asociado; desnormalizado para el listado.
        email:
          type: string
          format: email
          description: Ídem, desde el Usuario asociado.
      example:
        id: 2
        usuarioId: 1
        sedeOrigenId: 3
        fechaAlta: '2026-09-15T00:00:00-03:00'
        nombre: Ana Gómez
        email: ana.gomez@fitzone.com.ar
    Plan:
      type: string
      enum:
        - MENSUAL
        - TRIMESTRAL
        - ANUAL
    EstadoMembresia:
      type: string
      enum:
        - ACTIVA
        - VENCIDA
        - SUSPENDIDA
    MembresiaPatch:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        renuevaAutomatica:
          type: boolean
          description: false frena la renovación automática al vencer.
        estado:
          type: string
          enum:
            - ACTIVA
            - SUSPENDIDA
          description: >
            Suspender una membresía activa (SUSPENDIDA) o volverla a ACTIVA. VENCIDA no se acepta por esta vía: solo la produce el proceso diario que vence las membresías cuya fecha_fin ya pasó, de
            modo que un VENCIDA siempre tenga la fecha vencida.
      additionalProperties: false
    MembresiaOut:
      type: object
      required:
