        aparecer en las respuestas aunque no viva en la columna.
      enum:
        - CONFIRMADA
        - CANCELADA
        - CUMPLIDA
    EstadoReservaClase:
      type: string
      description: >
        Estado efectivo de la reserva de clase. CONFIRMADA y CANCELADA son los valores persistidos; CUMPLIDA se DERIVA de la fecha de fin de la clase y puede
        aparecer en las respuestas aunque no viva en la columna.
      enum:
        - CONFIRMADA
        - CANCELADA
        - CUMPLIDA
