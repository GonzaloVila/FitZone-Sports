        socioId:
          type: integer
          description: Socio que ingresa; debe tener membresía vigente (RF-04).
          example: 2
        codigoTotp:
          type: string
          description: >
            Código TOTP de 6 dígitos que muestra la app del socio (RF-04, Unidad III). El puesto lo lee del QR dinámico. Si el socio nunca activó el QR (totp_secreto nulo) el ingreso valida solo la
