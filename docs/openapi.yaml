        socioId:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoEspera'
        fechaAnotacion:
          type: string
          format: date-time
        fechaNotificacion:
          type: string
          format: date-time
          nullable: true
          description: Cuándo el servidor notificó el cupo liberado (RF-08). Null hasta ese momento.
        fechaConfirmacion:
          type: string
          format: date-time
          nullable: true
          description: Cuándo el socio confirmó y tomó el cupo (first-come). Null mientras no confirme.
      example:
        id: 10
        claseId: 4
        socioId: 2
        estado: EN_ESPERA
        fechaAnotacion: '2026-09-16T17:30:00-03:00'
        fechaNotificacion: null
        fechaConfirmacion: null
    ReservaCanchaIn:
      type: object
      required:
        - canchaId
        - fechaHoraInicio
        - fechaHoraFin
      properties:
        canchaId:
          type: integer
        usuarioId:
          type: integer
          description: Quién reserva (Socio o Cliente Externo, RF-01). Si se omite, se toma del token en la Unidad III.
        fechaHoraInicio:
          type: string
          format: date-time
          example: '2026-09-16T18:00:00-03:00'
        fechaHoraFin:
          type: string
          format: date-time
          example: '2026-09-16T19:00:00-03:00'
      additionalProperties: false
    ReservaCanchaOut:
      type: object
      required:
        - id
        - canchaId
        - usuarioId
        - fechaHoraInicio
        - fechaHoraFin
        - estado
        - precioAplicado
      properties:
        id:
          type: integer
        canchaId:
          type: integer
        usuarioId:
          type: integer
        fechaHoraInicio:
          type: string
          format: date-time
        fechaHoraFin:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        precioAplicado:
          type: number
          description: Tarifa del momento (RF-09/RF-11); el Strategy decide socio/externo/pico.
      example:
        id: 7
        canchaId: 6
        usuarioId: 1
        fechaHoraInicio: '2026-09-16T18:00:00-03:00'
        fechaHoraFin: '2026-09-16T19:00:00-03:00'
        estado: CONFIRMADA
        precioAplicado: 4250
    EstadoPago:
      type: string
      enum:
        - PENDIENTE
        - APROBADO
        - RECHAZADO
        - ANULADO
    ConceptoPago:
      oneOf:
        - type: object
          required:
            - tipo
            - reservaCanchaId
          properties:
            tipo:
              type: string
              enum:
                - RESERVA_CANCHA
            reservaCanchaId:
              type: integer
          additionalProperties: false
        - type: object
          required:
            - tipo
            - membresiaId
          properties:
            tipo:
              type: string
              enum:
                - MEMBRESIA
            membresiaId:
              type: integer
          additionalProperties: false
        - type: object
          required:
            - tipo
            - reservaClaseId
          properties:
            tipo:
              type: string
              enum:
                - RESERVA_CLASE
            reservaClaseId:
              type: integer
          additionalProperties: false
      description: Un pago referencia estructuralmente UN solo concepto (reserva de cancha, membresía o penalidad de clase, herencia parte-todo).
    PagoIn:
      type: object
      required:
        - concepto
        - token
      properties:
        concepto:
          $ref: '#/components/schemas/ConceptoPago'
        token:
          type: string
          writeOnly: true
          description: Token de la pasarela (RNF-02); nunca se envía ni almacena la tarjeta.
        moneda:
          type: string
          default: ARS
          example: ARS
      additionalProperties: false
    PagoOut:
      type: object
      required:
        - id
        - usuarioId
        - concepto
        - monto
        - moneda
        - estado
        - fechaPago
      properties:
        id:
          type: integer
        usuarioId:
          type: integer
        concepto:
          $ref: '#/components/schemas/ConceptoPago'
        monto:
          type: number
          description: Importe computado por la regla de negocio.
        moneda:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoPago'
        fechaPago:
          type: string
          format: date-time
          description: |
            Momento del cobro. Es lo que permite ordenar el listado, filtrar por período (?desde=/?hasta=) y conciliar contra el reporte de la pasarela.
          example: '2026-09-16T18:42:11.204Z'
        comprobantePdfUrl:
          type: string
          nullable: true
          description: Adjunto del snapshot de la RF-14, solo cuando el pago está aprobado.
      example:
        id: 8
        usuarioId: 1
        concepto:
          tipo: RESERVA_CANCHA
          reservaCanchaId: 7
        monto: 4250
        moneda: ARS
        estado: APROBADO
        fechaPago: '2026-09-16T18:42:11.204Z'
        comprobantePdfUrl: https://cdn.fitzone.com.ar/comprobantes/8.pdf
    Problem:
      type: object
      description: Cuerpo de error según RFC 9457 (application/problem+json).
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          description: 'Solo en errores de validación (422): lista de reglas incumplidas.'
          items:
            type: string
          example:
            - nombre must be a string
  responses:
    BadRequest:
      description: Solicitud mal formada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Solicitud incorrecta
            status: 400
            detail: 'La solicitud está mal formada: el cuerpo no es JSON válido o algún parámetro tiene un formato inválido.'
    NoAutorizado:
      description: Token inválido, expirado o ausente
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso no encontrado (o dado de baja)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Recurso no encontrado
            status: 404
            detail: No existe el recurso solicitado para el id indicado.
    Conflict:
      description: DNI o email ya registrado; el detail nombra el campo en conflicto
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflicto de unicidad
            status: 409
            detail: El email ana.gomez@fitzone.com.ar ya está registrado.
    SocioExistente:
      description: El usuario ya es socio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: El usuario ya es socio
            status: 409
            detail: El usuario 1 ya tiene un registro de socio.
    ConflictoReservaCancha:
      description: >
        409 de la creación de una reserva. Son dos causas distintas y el `type` las separa: `turno-ocupado` es concurrencia (RN-02, otro usuario ganó el turno) y `cancha-en-mantenimiento` es una
        cancha inhabilitada (RF-12, donde no hubo concurrencia y por eso el detalle del primero sería falso). Se agrupan en una sola respuesta porque cada operación admite un único 409 y en los dos
        casos el cliente hace lo mismo: ofrecerle otro turno u otra cancha.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            turno-ocupado:
              summary: El turno ya estaba reservado por otro usuario
              value:
                type: https://fitzone.app/errores/turno-ocupado
                title: El turno seleccionado ya fue reservado
                status: 409
                detail: Otro usuario reservó el turno para esa fecha y hora antes que vos.
                instance: https://fitzone.app/api/v1/reservas-canchas
            cancha-en-mantenimiento:
              summary: La cancha está en mantenimiento y no admite reservas
              value:
                type: https://fitzone.app/errores/cancha-en-mantenimiento
                title: Cancha en mantenimiento
                status: 409
                detail: La cancha 3 está en mantenimiento y no admite reservas nuevas (RF-12).
                instance: https://fitzone.app/api/v1/reservas-canchas
    ConflictoCancelacionReserva:
      description: >
        409 de la cancelación de una reserva. Dos causas, separadas por `type`: `reserva-ya-cancelada` (ya estaba CANCELADA) y `reserva-pasada` (el turno ya empezó, estado efectivo CUMPLIDA). En ambos
        casos es 409 y no 404 porque RF-12 conserva el histórico: el recurso existe y lo que choca es la transición pedida contra el estado actual.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reserva-ya-cancelada:
              summary: La reserva ya estaba cancelada
              value:
                type: https://fitzone.app/errores/reserva-ya-cancelada
                title: Reserva ya cancelada
                status: 409
                detail: La reserva 7 ya estaba cancelada y no puede cancelarse de nuevo.
                instance: https://fitzone.app/api/v1/reservas-canchas/7/cancelaciones
            reserva-pasada:
              summary: El turno ya comenzó y no puede cancelarse
              value:
                type: https://fitzone.app/errores/reserva-pasada
                title: Reserva ya pasada
                status: 409
                detail: La reserva 7 corresponde a un turno que ya comenzó y no puede cancelarse.
                instance: https://fitzone.app/api/v1/reservas-canchas/7/cancelaciones
    MissingIdempotency:
      description: Falta la cabecera Idempotency-Key
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Falta Idempotency-Key
            status: 400
            detail: La cabecera Idempotency-Key es obligatoria en /pagos.
    IdempotenciaRepetida:
      description: La Idempotency-Key ya fue utilizada (unique del esquema; la pasarela no se invoca dos veces)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://fitzone.app/errores/idempotencia-repetida
            title: Idempotency-Key repetida
            status: 409
            detail: Ya existe un pago con esa Idempotency-Key.
    ReservaClasePasada:
      description: >
        409 de la cancelación de una reserva de clase: la clase ya comenzó (estado efectivo CUMPLIDA), así que no se cancela lo que ya ocurrió.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://fitzone.app/errores/reserva-clase-pasada
            title: Reserva de clase pasada
            status: 409
            detail: La reserva 5 corresponde a una clase que ya comenzó y no puede cancelarse.
            instance: https://fitzone.app/api/v1/reservas-clases/5/cancelaciones
    PagoRechazado:
      description: La pasarela rechazó el cobro
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Pago rechazado
            status: 402
            detail: La pasarela rechazó el token (fondos insuficientes o token inválido).
    PagoNoAnulable:
      description: El pago está RECHAZADO (nunca se cobró) y no es anulable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Pago no anulable
            status: 409
            detail: El pago 8 está en estado RECHAZADO y no puede anularse.
    PagoNoAprobado:
      description: El pago no está aprobado y no tiene comprobante
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Pago no aprobado
            status: 409
            detail: El pago está en estado RECHAZADO; no se puede generar un comprobante.
    MembresiaInactiva:
      description: La membresía del usuario no está vigente (RF-04)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://fitzone.app/errores/membresia-inactiva
            title: Membresía inactiva
            status: 403
            detail: El usuario 2 no posee una membresía vigente para ingresar a la sede 3.
    ConflictoAcceso:
      description: RN-01 (usuario ya dentro de otra sede) o aforo lleno (RF-05)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            acceso-duplicado:
              value:
                type: https://fitzone.app/errores/acceso-duplicado
                title: Acceso duplicado
                status: 409
                detail: El usuario 2 ya tiene un ingreso sin egreso registrado (RN-01).
            aforo-lleno:
              value:
                type: https://fitzone.app/errores/aforo-lleno
                title: Aforo de la sede completo
                status: 409
                detail: La sede 3 alcanzó su aforo máximo (120 personas); no se admiten más ingresos (RF-05).
    EgresoDuplicado:
      description: El ingreso ya fue egresado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://fitzone.app/errores/egreso-duplicado
            title: Egreso duplicado
            status: 409
            detail: El ingreso 9 ya tiene fecha_hora_egreso; no se puede egresar dos veces.
    ConflictoEspera:
      description: No se puede anotar en espera — la clase aún tiene cupo (RF-06), el socio ya tiene una espera o una reserva activa (RF-08), o la clase ya comenzó o finalizó.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            clase-pasada:
              value:
                type: https://fitzone.app/errores/clase-pasada
                title: Clase no disponible
                status: 409
                detail: No es posible anotarse en espera para una clase que ya comenzó o ha finalizado.
            cupo-disponible:
              value:
                type: https://fitzone.app/errores/cupo-disponible
                title: Cupo disponible
                status: 409
                detail: La clase 4 aún cuenta con lugares disponibles (2). Puede reservar directamente sin ingresar a la lista de espera.
            espera-existente:
              value:
                type: https://fitzone.app/errores/espera-existente
                title: Espera o reserva existente
                status: 409
                detail: El socio 2 ya se encuentra inscripto en espera o ya posee una reserva confirmada para la clase 4.
    EsperaConfirmada:
      description: La espera ya fue confirmada y no admite baja (RF-08/RF-07)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://fitzone.app/errores/espera-confirmada
            title: Espera ya confirmada
            status: 409
            detail: La anotación 10 ya tomó el cupo; cancele por /reservas-clases/{id}/cancelaciones (RF-07).
    ConfirmacionRechazada:
      description: La espera no está NOTIFICADA o el cupo ya lo tomó otro socio (first-come, RF-08)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no-notificada:
              value:
                type: https://fitzone.app/errores/espera-no-notificada
                title: La espera no fue notificada
                status: 409
                detail: La anotación 10 sigue en EN_ESPERA; aún no se liberó un cupo.
            cupo-tomado:
              value:
                type: https://fitzone.app/errores/cupo-tomado
                title: El cupo ya fue tomado
                status: 409
                detail: Otra persona notificada confirmó primero y el cupo ya no está disponible.
    SocioEnMora:
      description: El socio posee cuotas vencidas; no puede reservar ni anotarse en espera con tarifa bonificada (RF-07/RF-08)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reserva-clases:
              value:
                type: https://fitzone.app/errores/socio-en-mora
                title: Socio en mora
                status: 403
                detail: El socio 2 posee cuotas vencidas. No puede reservar con tarifa bonificada. Puede abonar el precio de cliente externo.
            espera-clases:
              value:
                type: https://fitzone.app/errores/socio-en-mora
                title: Socio en mora
                status: 403
                detail: El socio 2 posee cuotas vencidas. No puede ingresar a la lista de espera de clases bonificadas.
    ConflictoReservaClase:
      description: La reserva no se crea — fuera de la ventana de 48 hs previas (RF-07), clase ya iniciada, cupo agotado (RF-06) o reserva duplicada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reserva-anticipada:
              value:
                type: https://fitzone.app/errores/reserva-anticipada-no-permitida
                title: Reserva anticipada no permitida
                status: 409
                detail: Las reservas de clases solo se habilitan dentro de las 48 horas previas al inicio.
            clase-pasada:
              value:
                type: https://fitzone.app/errores/clase-pasada
                title: Clase no disponible
                status: 409
                detail: No es posible reservar una clase que ya comenzó o ha finalizado.
            cupo-agotado:
              value:
                type: https://fitzone.app/errores/cupo-agotado
                title: Cupo de clase agotado
                status: 409
                detail: La clase 4 alcanzó su capacidad máxima (20). Puede ingresar a la lista de espera (RF-08).
            reserva-duplicada:
              value:
                type: https://fitzone.app/errores/reserva-duplicada
                title: Reserva duplicada
                status: 409
                detail: El socio 2 ya posee una reserva confirmada para la clase 4.
    ClaseFueraDeHorario:
      description: La clase no se puede programar — horario no ISO-8601 o momento ya pasado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            fecha-invalida:
              value:
                type: https://fitzone.app/errores/fecha-invalida
                title: Horario inválido
                status: 409
                detail: El formato de fecha y hora no corresponde a un ISO-8601 válido.
            clase-pasada:
              value:
                type: https://fitzone.app/errores/clase-pasada
                title: Clase en horario pasado
                status: 409
                detail: No se puede programar una clase en una fecha u hora pasada.
    ValidationError:
      description: Datos inválidos (ValidationPipe con class-validator)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Error de validación
            status: 422
            detail: Uno o más campos no cumplen las reglas de validación.
            errors:
              - nombre must be a string
security: []
