          description: |
            Momento real del acceso. Opcional para el puesto de control offline (RNF-01): cuando sincroniza, reporta la hora en que ocurrió el ingreso. Si se omite, el servidor usa su hora actual.
          example: '2026-09-16T18:02:11-03:00'
        validadoOffline:
          type: boolean
          description: |
            Marca el ingreso como validado por el puesto de control offline (RNF-01). Si se omite, el servidor asume false (ingreso online en tiempo real).
