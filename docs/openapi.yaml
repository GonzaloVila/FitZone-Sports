openapi: 3.0.3
info:
  title: FitZone Sports API — Primera REST API
  description: >
    Contrato OpenAPI de la primera versión de la API REST del backend de FitZone Sports (Unidad II · SCRUM-11c · lotes L1–L6). Organizado por entidad: cada recurso expone los verbos que el caso
    contempla — POST/GET/PATCH en usuarios, socios y membresías; GET/POST en sedes, canchas y clases (PATCH de cancha para RF-09/RF-12). Las reservas son dos entidades aparte, espejo del modelo
    (ReservaCancha y ReservaClase): los turnos de cancha en /reservas-canchas (RF-10/RF-12/RN-02) y el cupo de clase en /reservas-clases (RF-06, con cancelación por RF-07). Convenciones: prefijo
    /api/v1, nivel 2 de Richardson, errores como application/problem+json (RFC 9457), Location en 201 e Idempotency-Key en pagos. Sin DELETE de usuarios/sedes/canchas/clases (el caso no lo pide): la
    "baja" de una reserva es su cancelación (sub-recurso) y dejar de ser socio es DELETE /socios (vuelve a EXTERNO). Pago no tiene PATCH/DELETE: un cobro mal hecho se ANULA y se repaga con nueva
    Idempotency-Key (nunca se edita el comprobante). La autenticación (JWT) se incorpora en la Unidad III: /auth/login, /auth/refresh y /auth/logout son públicos (los dos últimos se autentican por el refresh token), y los endpoints protegidos se marcan con security: [{ bearer: [] }].
    El QR dinámico (RF-04) usa TOTP (RFC 6238): el puesto lee el código de 6 dígitos de la app del socio (IngresoIn.codigo_totp) y lo valida contra el secreto cifrado; /bloqueados y
    /sincronizacion/ingresos dan soporte al puesto de control offline (RNF-01). Los cambios de estado no van por PATCH: el path nombra la transición permitida, así las ilegales son inalcanzables. Las
    transiciones de estado usan sustantivo plural — /cancelaciones, /anulaciones, /confirmaciones. El egreso es la única excepción, en verbo (/ingresos/{ingresoId}/egreso), porque es la segunda fase
    del ciclo de vida de un ingreso y no una transición de estado. Un POST que crea un recurso devuelve 201 con Location y cuerpo; uno que solo cambia estado y no crea nada devuelve 204. Los listados
    excluyen los estados terminales salvo que se pidan explícitamente con ?estado=.
  version: 1.0.0
  license:
    name: Académico — TFI FitZone Sports (UNVM)
    url: https://github.com/GonzaloVila/FitZone-Sports
servers:
  - url: http://localhost:3000/api/v1
    description: Local (prefijo global api/v1)
tags:
  - name: usuarios
    description: Usuarios y perfiles (M1)
  - name: socios
    description: Socios y su sede de origen (M1)
  - name: membresias
    description: Membresías (1:1 con socio, sin historial) (M1)
  - name: sedes
    description: Sedes de la cadena (M2)
  - name: auth
    description: Autenticación JWT y registro de QR TOTP (Unidad III)
  - name: bloqueados
    description: Lista de no vigentes para sincronizar offline (Unidad III)
  - name: ingresos
    description: Ingresos y egresos de sede y sincronización offline (M2)
  - name: esperas-clases
    description: Lista de espera de clases (M3)
  - name: canchas
    description: Canchas y disponibilidad (M4)
  - name: clases
    description: Clases (M3)
  - name: reservas-canchas
    description: Reservas de turnos de cancha (M4)
  - name: reservas-clases
    description: Reservas de cupo de clase (M3)
  - name: pagos
    description: Pagos y comprobantes (M5)
  - name: reportes
    description: Reporte de ingresos por período (Unidad IV, CQRS)
paths:
  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Login con email y contraseña
      description: >
        Autentica un usuario y devuelve un JWT. Público (no requiere token). El payload del token lleva `sub`, `rol` y, solo para RECEPCION, `sede_id` (la sucursal de trabajo sale de EmpleadoSede).
        Credenciales inválidas responden 401. Además del access token (corto, el front lo guarda en memoria) abre una sesión con un refresh token rotativo: los clientes web lo reciben en la cookie
        HttpOnly `refresh_token` (Path=/api/v1/auth) y no en el body; los clientes móviles, que mandan el header `X-Cliente: movil`, lo reciben en `LoginOut.refreshToken` y no se les setea cookie.
        Cada login abre una sesión (familia de refresh tokens) nueva.
      parameters:
        - name: X-Cliente
          in: header
          required: false
          description: >
            Con el valor `movil` el refresh token viaja en el body (campo `refreshToken`) y no se setea cookie. Sin este header el refresh token va solo en la cookie HttpOnly `refresh_token`.
          schema:
            type: string
            enum:
              - movil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Login exitoso
          headers:
            Set-Cookie:
              description: >
                Cookie `refresh_token` (HttpOnly, Path=/api/v1/auth, SameSite y Secure según la configuración). No se envía si el request trae `X-Cliente: movil`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: refrescarToken
      summary: Renueva el access token y rota el refresh token
      description: >
        Público: se autentica por el refresh token, que llega por body (`RefreshIn`, clientes móviles) o por la cookie `refresh_token`; si vienen los dos, manda el body. La respuesta vuelve por el
        mismo canal: body → `LoginOut.refreshToken`; cookie → nueva cookie `refresh_token` y body sin refresh token. Cuando el token llega por cookie se exige el header `Origin` y que esté entre los
        orígenes permitidos (defensa CSRF, además de SameSite); si falta o no está permitido responde 403. Cada refresh token sirve una sola vez: se rota, y presentar uno ya usado (robado o de un
        cliente duplicado) revoca todas las sesiones del usuario. No hay período de gracia: dos refresh simultáneos con el mismo token cuentan como reuso, así que el cliente tiene que serializar la
        renovación. Inexistente, vencido, revocado o reusado responden el mismo 401; un refresh fallido por cookie borra la cookie. El access token nuevo sale con el rol y la sede actuales del usuario.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
      responses:
        '200':
          description: Sesión renovada
          headers:
            Set-Cookie:
              description: >
                Cookie `refresh_token` rotada (HttpOnly, Path=/api/v1/auth, SameSite y Secure según la configuración). Solo cuando el refresh token llegó por cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '401':
          description: Refresh token ausente, inexistente, vencido, revocado o reusado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: El token llegó por cookie y el header Origin falta o no está permitido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      tags:
        - auth
      operationId: cerrarSesion
      summary: Cierra la sesión del dispositivo (revoca la familia del refresh token)
      description: >
        Público y sin bearer: se autentica por el refresh token (body `RefreshIn` o cookie `refresh_token`, igual que `/auth/refresh`; si vienen los dos, manda el body). Revoca todos los refresh
        tokens de la familia del presentado, es decir la sesión de ese dispositivo; las de otros dispositivos siguen vivas. Idempotente: un token desconocido, ya revocado o ausente también responde
        204. Cuando el token llega por cookie se exige el header `Origin` permitido (403 si falta o no lo está) y la respuesta borra la cookie (Max-Age=0).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
      responses:
        '204':
          description: Sesión cerrada
          headers:
            Set-Cookie:
              description: Cookie `refresh_token` vacía con Max-Age=0 (solo cuando el refresh token llegó por cookie).
              schema:
                type: string
        '403':
          description: El token llegó por cookie y el header Origin falta o no está permitido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/registro-qr:
    post:
      tags:
        - auth
      operationId: registrarQr
      summary: Genera secreto TOTP y QR URI para el socio autenticado
      description: >
        Crea (o sobrescribe) el secreto TOTP del socio autenticado y devuelve la URI `otpauth://` para escanear con una app de autenticación. Solo SOCIO (RF-04). Requiere token. No hay recovery codes:
        perder el celular se resuelve re-registrando el QR.
      security:
        - bearer: []
      responses:
        '201':
          description: QR generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroQrOut'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario autenticado no es socio
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: El usuario autenticado no tiene registro de socio
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /bloqueados:
    get:
      tags:
        - bloqueados
      operationId: listarBloqueados
      summary: Lista de usuarios NO vigentes (para sincronizar offline)
      description: >
        Descarga que usa el puesto de control offline (RNF-01): devuelve los usuarios con membresía VENCIDA o SUSPENDIDA cuyo estado cambió desde `actualizado_desde` (sincronización incremental). Sin
        el parámetro trae el universo completo. Solo RECEPCION y GERENTE (RF-04, Unidad III).
      security:
        - bearer: []
      parameters:
        - name: actualizadoDesde
          in: query
          required: false
          description: Sincronización incremental; solo los que cambiaron de vigencia desde este instante.
          schema:
            type: string
          example: '2026-10-03T00:00:00Z'
      responses:
        '200':
          description: Listado de no vigentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueadosOut'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: Rol sin permiso (solo RECEPCION/GERENTE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /usuarios:
    get:
      tags:
        - usuarios
      operationId: listarUsuarios
      summary: Listado de usuarios con filtros
      description: |
        Filtros por rol, sede de trabajo, nombre y email (lista blanca de parámetros) y paginación. `sedeId` filtra por el puesto en `EmpleadoSede`, así que solo devuelve personal con puesto en esa sede
        (hoy, el recepcionista); no tiene relación con la sede de origen de un socio. Como en GET /ingresos y GET /socios, un `sedeId` inexistente no es un error: responde 200 con la lista vacía.
      parameters:
        - name: rol
          in: query
          required: false
          description: Rol del usuario. Sin filtro devuelve todos los roles.
          schema:
            $ref: '#/components/schemas/Rol'
        - name: sedeId
          in: query
          required: false
          description: 'Sede de trabajo (EmpleadoSede): devuelve solo usuarios con puesto en esa sede'
          schema:
            type: integer
            minimum: 1
          example: 3
        - name: nombre
          in: query
          required: false
          description: coincidencia parcial sobre el nombre.
          schema:
            type: string
          example: Ana
        - name: email
          in: query
          required: false
          description: Email exacto (es único en el esquema).
          schema:
            type: string
            format: email
          example: ana.gomez@fitzone.com.ar
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaUsuarios'
              example:
                items:
                  - id: 1
                    rol: EXTERNO
                    dni: '35123456'
                    nombre: Ana Gómez
                    email: ana.gomez@fitzone.com.ar
                    telefono: +54 351 555-1234
                    fotoUrl: https://cdn.fitzone.com.ar/fotos/ana.jpg
                total: 1
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - usuarios
      operationId: crearUsuario
      summary: Registrar usuario
      description: >
        Alta de usuario distinguiendo el rol de perfil (EXTERNO | RECEPCION | GERENTE). DNI y email son únicos. La contrasenia se guarda hasheada (bcrypt), nunca en texto plano. Un usuario NO se crea
        como SOCIO acá: hacerse socio es POST /socios, que lo convierte y crea su membresía inicial. Para RECEPCION (`A3`) `sedeId` es obligatorio y se materializa como fila de `EmpleadoSede` (1:1: una sede
        tiene a lo sumo un recepcionista y un recepcionista trabaja en una sola sede); para EXTERNO y GERENTE la sede no aplica y enviarla es un 422. Esa asignación no se modifica después por API.
        Responde 201 con el header Location apuntando al recurso creado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioIn'
      responses:
        '201':
          description: Usuario registrado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/usuarios/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOut'
              example:
                id: 1
                rol: EXTERNO
                dni: '35123456'
                nombre: Ana Gómez
                email: ana.gomez@fitzone.com.ar
                telefono: +54 351 555-1234
                fotoUrl: https://cdn.fitzone.com.ar/fotos/ana.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: La sede de trabajo indicada no existe (solo RECEPCION)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            El email o el DNI ya están registrados, o la sede de trabajo indicada ya tiene un recepcionista
            (`EmpleadoSede.sede_id` es único).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags:
        - usuarios
      operationId: obtenerUsuario
      summary: Obtener usuario por id
      description: Devuelve el perfil del usuario (sin datos de contraseña). Si no existe, 404.
      responses:
        '200':
          description: Perfil del usuario (sin datos de contraseña)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOut'
              example:
                id: 1
                rol: SOCIO
                dni: '35123456'
                nombre: Ana Gómez
                email: ana.gomez@fitzone.com.ar
                telefono: +54 351 555-1234
                fotoUrl: https://cdn.fitzone.com.ar/fotos/ana.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - usuarios
      operationId: modificarUsuario
      summary: Modificar parcialmente un usuario
      description: |
        Actualización parcial de contacto, foto y/o contraseña (contrasenia se hashea). Campos ausentes en el body no se modifican. Si el id no existe, responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioPatch'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOut'
              example:
                id: 1
                rol: SOCIO
                dni: '35123456'
                nombre: Ana Gómez
                email: ana.gomez@fitzone.com.ar
                telefono: +54 351 555-1234
                fotoUrl: https://cdn.fitzone.com.ar/fotos/ana.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /socios:
    get:
      tags:
        - socios
      operationId: listarSocios
      summary: Listado de socios con filtros
      description: >
        Filtros por sede de origen, estado y plan de la membresía, y por nombre (lista blanca de parámetros) y paginación. `estado_membresia` y `plan` cruzan la relación 1:1 a la membresía del socio.
        Sin ningún filtro devuelve todos los socios de la cadena.
      parameters:
        - name: sedeOrigenId
          in: query
          required: false
          description: ID numérico de la sede de origen
          schema:
            type: integer
          example: 3
        - name: estadoMembresia
          in: query
          required: false
          description: Estado de la membresía asociada al socio.
          schema:
            $ref: '#/components/schemas/EstadoMembresia'
        - name: plan
          in: query
          required: false
          description: Plan de la membresía asociada al socio.
          schema:
            $ref: '#/components/schemas/Plan'
        - name: nombre
          in: query
          required: false
          description: coincidencia parcial sobre el nombre del usuario asociado.
          schema:
            type: string
          example: Ana
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de socios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSocios'
              example:
                items:
                  - id: 2
                    usuarioId: 1
                    sedeOrigenId: 3
                    fechaAlta: '2026-09-15T00:00:00-03:00'
                    nombre: Ana Gómez
                    email: ana.gomez@fitzone.com.ar
                total: 1
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - socios
      operationId: crearSocio
      summary: Alta de socio (RF-02)
      description: >
        Convierte al usuario en socio (subtabla Socio) indicando su sede de origen y crea la membresía inicial con el plan enviado, en la misma transacción: no existe un socio sin membresía. Un
        usuario que ya es socio responde 409. Lo inverso es DELETE /socios/{id} (dejar de ser socio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocioIn'
      responses:
        '201':
          description: Socio creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/socios/2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioOut'
              example:
                id: 2
                usuarioId: 1
                sedeOrigenId: 3
                fechaAlta: '2026-09-15T00:00:00-03:00'
                nombre: Ana Gómez
                email: ana.gomez@fitzone.com.ar
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PagoRechazado'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SocioExistente'
        '422':
          $ref: '#/components/responses/ValidationError'
  /socios/{socioId}:
    parameters:
      - $ref: '#/components/parameters/SocioId'
    get:
      tags:
        - socios
      operationId: obtenerSocio
      summary: Obtener socio por id
      description: Devuelve el perfil del socio junto con su sede de origen y fecha de alta.
      responses:
        '200':
          description: Perfil del socio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioOut'
              example:
                id: 2
                usuarioId: 1
                sedeOrigenId: 3
                fechaAlta: '2026-09-15T00:00:00-03:00'
                nombre: Ana Gómez
                email: ana.gomez@fitzone.com.ar
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - socios
      operationId: modificarSocio
      summary: Modificar parcialmente un socio
      description: Actualización parcial (por ejemplo, la sede de origen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocioPatch'
      responses:
        '200':
          description: Socio actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioOut'
              example:
                id: 2
                usuarioId: 1
                sedeOrigenId: 3
                fechaAlta: '2026-09-15T00:00:00-03:00'
                nombre: Ana Gómez
                email: ana.gomez@fitzone.com.ar
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - socios
      operationId: dejarDeSerSocio
      summary: Dejar de ser socio
      description: >
        "Dar de baja un socio" equivale a dejar de ser socio: se elimina su fila en la subtabla Socio (y la membresía, relación 1:1) y el usuario vuelve a rol EXTERNO. El historial de reservas y pagos
        se conserva: referencia al usuario, no a la subtabla. Un socio inexistente responde 404.
      responses:
        '204':
          description: Deja de ser socio (sin cuerpo)
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /socios/{socioId}/membresias:
    parameters:
      - $ref: '#/components/parameters/SocioId'
    get:
      tags:
        - membresias
      operationId: obtenerMembresia
      summary: Membresía actual del socio
      description: |
        Devuelve la membresía vigente del socio (relación 1:1, sin historial). Todo socio tiene membresía desde su alta, así que el 404 es solo por socio inexistente.
      responses:
        '200':
          description: Membresía del socio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembresiaOut'
              example:
                id: 9
                plan: MENSUAL
                estado: ACTIVA
                fechaInicio: '2026-09-15T00:00:00-03:00'
                fechaFin: '2026-10-15T00:00:00-03:00'
                renuevaAutomatica: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - membresias
      operationId: modificarMembresia
      summary: Cambiar plan o configuración de la membresía
      description: >
        Cambio de plan, renovación automática y/o estado sobre la misma fila (1:1, sin historial). Frenar la renovación = renueva_automatica:false; suspender = estado:SUSPENDIDA. Mandar `plan` abre un
        período nuevo desde HOY: fecha_inicio y fecha_fin se recalculan juntas con la duración del plan enviado, así que la membresía queda vigente desde la fecha del PATCH hasta un plan después. Los
        días que quedaban del período anterior no se trasladan. Sin `plan` en el body, ninguna de las dos fechas se toca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembresiaPatch'
      responses:
        '200':
          description: Membresía actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembresiaOut'
              example:
                id: 9
                plan: MENSUAL
                estado: ACTIVA
                fechaInicio: '2026-09-15T00:00:00-03:00'
                fechaFin: '2026-10-15T00:00:00-03:00'
                renuevaAutomatica: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PagoRechazado'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sedes:
    get:
      tags:
        - sedes
      operationId: listarSedes
      summary: Listado de sedes
      description: Listado paginado de todas las sedes de la cadena (Gerente Central, A4). Solo admite paginación (lista blanca de parámetros).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de sedes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSedes'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - sedes
      operationId: crearSede
      summary: Alta de sede
      description: |
        Alta de una nueva sucursal por el Gerente Central (RNF-04). La sede queda disponible para canchas, clases y control de acceso en forma inmediata (configuración por BD).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SedeIn'
      responses:
        '201':
          description: Sede creada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/sedes/3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeOut'
        '422':
          $ref: '#/components/responses/ValidationError'
  /ingresos:
    get:
      tags:
        - ingresos
      operationId: listarIngresos
      summary: Listado de ingresos a sede con filtros
      description: >
        Filtros por sede, usuario, nombre y día (lista blanca de parámetros) y paginación. `dentro=true` devuelve solo los ingresos sin egreso, es decir los usuarios que siguen en la sede; es el
        detalle que /sedes/{sedeId}/aforo no da porque ese solo devuelve el número de ocupantes (RN-01). Requiere token: RECEPCION solo ve su sede (se fuerza el `sede_id` del JWT) y GERENTE ve
        cualquiera.
      security:
        - bearer: []
      parameters:
        - name: sedeId
          in: query
          required: false
          description: ID numérico de la sede
          schema:
            type: integer
          example: 3
        - name: socioId
          in: query
          required: false
          description: ID numérico del socio que ingresó
          schema:
            type: integer
          example: 2
        - name: nombre
          in: query
          required: false
          description: Coincidencia parcial sobre el nombre del usuario, sin distinguir mayúsculas.
          schema:
            type: string
          example: Juan
        - name: fecha
          in: query
          required: false
          description: Día consultado (YYYY-MM-DD, hora local de la sede).
          schema:
            type: string
            format: date
          example: '2026-09-16'
        - name: dentro
          in: query
          required: false
          description: true trae solo los ingresos con fecha_hora_egreso nula (aún en la sede).
          schema:
            type: boolean
          example: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de ingresos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaIngresos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: Rol sin permiso (solo RECEPCION/GERENTE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - ingresos
      operationId: registrarIngreso
      summary: Registrar ingreso a la sede (RF-04)
      description: >
        Registra el turno de acceso. Valida que el usuario tenga una membresía vigente (RF-04: estado distinto de SUSPENDIDA y fecha_fin no vencida) y que la sede tenga espacio (RF-05, cuenta los
        Ingresos sin egreso contra Sede.aforo_maximo). RN-01: un usuario no puede estar dentro de dos sedes a la vez; si ya tiene un ingreso sin egreso responde 409 (acceso-duplicado). El codigo_totp
        es el QR dinámico de la app del socio (TOTP, Unidad III); si el socio no activó el QR, se valida solo la membresía. fecha_hora_ingreso es opcional para el puesto de control offline (RNF-01):
        enviar la hora real del acceso cuando se sincroniza.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngresoIn'
      responses:
        '201':
          description: Ingreso registrado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/ingresos/9
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngresoOut'
        '403':
          $ref: '#/components/responses/MembresiaInactiva'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictoAcceso'
        '422':
          $ref: '#/components/responses/ValidationError'
  /ingresos/{ingresoId}:
    parameters:
      - $ref: '#/components/parameters/IngresoId'
    get:
      tags:
        - ingresos
      operationId: obtenerIngreso
      summary: Obtener ingreso por id
      description: >
        Devuelve el registro del acceso. `fecha_hora_egreso` es nula mientras el usuario permanezca dentro de la sede (es lo que define el aforo, RN-01). Para el egreso ver POST
        /ingresos/{ingresoId}/egreso.
      responses:
        '200':
          description: Registro de ingreso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngresoOut'
        '404':
          $ref: '#/components/responses/NotFound'
  /ingresos/{ingresoId}/egreso:
    parameters:
      - $ref: '#/components/parameters/IngresoId'
    post:
      tags:
        - ingresos
      operationId: registrarEgreso
      summary: Registrar egreso de la sede (RF-05)
      description: >
        Cierra el turno de acceso escribiendo fecha_hora_egreso: libera el cupo de aforo (RF-05). Modelado como sub-recurso y sin body al igual que las cancelaciones. Un acceso ya egresado responde
        409 (egreso-duplicado); un ingreso inexistente, 404. Requiere token: RECEPCION solo egresa en su sede (403 si el ingreso no es de su sede); GERENTE egresa cualquiera.
      security:
        - bearer: []
      responses:
        '204':
          description: Egreso registrado (sin cuerpo)
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El ingreso no pertenece a la sede del recepcionista
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EgresoDuplicado'
  /sincronizacion/ingresos:
    post:
      tags:
        - ingresos
      operationId: sincronizarIngresos
      summary: Sincroniza lote de ingresos/egresos offline (RNF-01)
      description: >
        El puesto de control offline registró ingresos/egresos sin conexión (validando contra su lista local de bloqueados) y al reconectar los envía en lote. El `sede_id` NO viaja en el body: sale
        del JWT del RECEPCION (su EmpleadoSede). El servidor re-valida cada item (membresía vigente, RN-01, aforo) y responde un resultado por item con el `local_id` del puesto para reconciliar. Solo
        RECEPCION.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SincronizarIngresosIn'
      responses:
        '201':
          description: Lote procesado (resultado por item)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SincronizarIngresosOut'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: Rol sin permiso (solo RECEPCION) o sin sede asignada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sedes/{sedeId}/aforo:
    parameters:
      - $ref: '#/components/parameters/SedeId'
    get:
      tags:
        - sedes
      operationId: obtenerAforo
      summary: Aforo actual de una sede (RF-05)
      description: |
        aforo_actual = cantidad de Ingresos sin fecha_hora_egreso de la sede (RN-01); restante = aforo_maximo - aforo_actual. Es la misma cuenta que valida cada POST de acceso.
      responses:
        '200':
          description: Aforo actual de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AforoOut'
        '404':
          $ref: '#/components/responses/NotFound'
  /sedes/{sedeId}/canchas:
    parameters:
      - $ref: '#/components/parameters/SedeId'
    get:
      tags:
        - canchas
      operationId: listarCanchas
      summary: Listado de canchas de una sede
      description: >-
        Listado paginado de las canchas de la sede (incluye las no operativas, RF-12); opcional filtrar por ?estado= (lista blanca de parámetros). Sin ?estado= devuelve todas, incluidas las
        EN_MANTENIMIENTO.
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtro por estado (OPERATIVA | EN_MANTENIMIENTO). Si se omite, devuelve ambas.
          schema:
            $ref: '#/components/schemas/EstadoCancha'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de canchas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCanchas'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - canchas
      operationId: crearCancha
      summary: Alta de cancha (RF-09)
      description: El Gerente configura el tipo y el costo por hora (por defecto, operativa).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaIn'
      responses:
        '201':
          description: Cancha creada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/sedes/3/canchas/6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /canchas:
    get:
      tags:
        - canchas
      operationId: buscarCanchas
      summary: Listado de canchas de todas las sedes
      description: >-
        Listado paginado de las canchas de TODAS las sedes (incluye las no operativas, RF-12); opcional filtrar por sede, tipo y estado (lista blanca de parámetros). Sin filtros devuelve todas las
        canchas de la cadena. Orden estable por sede y luego por id (`sede_id asc, id asc`). Como en GET /ingresos y GET /socios, un `sedeId` bien formado pero inexistente no es un error: responde 200
        con la lista vacía (`items: []`, `total: 0`); el 404 de una sede inexistente es propio de GET /sedes/{sedeId}/canchas, donde la sede es parte de la ruta.
      parameters:
        - name: sedeId
          in: query
          required: false
          description: ID numérico de la sede. Si no existe, la lista vuelve vacía.
          schema:
            type: integer
            minimum: 1
          example: 3
        - name: tipo
          in: query
          required: false
          description: Filtro por tipo de cancha (PADDLE | FUTBOL5). Si se omite, devuelve ambos.
          schema:
            $ref: '#/components/schemas/TipoCancha'
        - name: estado
          in: query
          required: false
          description: Filtro por estado (OPERATIVA | EN_MANTENIMIENTO). Si se omite, devuelve ambas.
          schema:
            $ref: '#/components/schemas/EstadoCancha'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de canchas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCanchas'
        '422':
          $ref: '#/components/responses/ValidationError'
  /canchas/{canchaId}:
    parameters:
      - $ref: '#/components/parameters/CanchaId'
    get:
      tags:
        - canchas
      operationId: obtenerCancha
      summary: Obtener cancha por id
      responses:
        '200':
          description: Cancha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaOut'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - canchas
      operationId: modificarCancha
      summary: Modificar parcialmente una cancha
      description: |
        Actualiza costo_por_hora (RF-09) y/o estado. Pasar a EN_MANTENIMIENTO no borra las reservas ya tomadas (RF-12): inhabilitar el futuro no toca el histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaPatch'
      responses:
        '200':
          description: Cancha actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /canchas/{canchaId}/disponibilidad:
    parameters:
      - $ref: '#/components/parameters/CanchaId'
    get:
      tags:
        - canchas
      operationId: consultarDisponibilidad
      summary: Disponibilidad de turnos de una cancha
      description: >
        Consulta indexada por día (RNF-03). Devuelve los tramos horarios libres/ocupados para la fecha solicitada. Si la cancha está EN_MANTENIMIENTO todos los tramos responden disponible:false
        (RF-12): se bloquea el futuro sin tocar las reservas ya tomadas. La consulta usa el índice compuesto (cancha_id, fecha_hora_inicio). Solo admite ?fecha= y paginación (lista blanca de
        parámetros).
      parameters:
        - name: fecha
          in: query
          required: true
          description: Día consultado (YYYY-MM-DD, hora local de la sede).
          schema:
            type: string
            format: date
            example: '2026-09-16'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Disponibilidad del día
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDisponibilidad'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /clases:
    get:
      tags:
        - clases
      operationId: listarClases
      summary: Listado de clases con filtros
      description: Filtrado por tipo y/o sede (lista blanca de parámetros) y paginación.
      parameters:
        - name: tipo
          in: query
          required: false
          description: Tipo de clase (libre; ej. Spinning, Yoga).
          schema:
            type: string
        - name: sedeId
          in: query
          required: false
          description: ID numérico de la sede
          schema:
            type: integer
            example: 3
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de clases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaClases'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - clases
      operationId: crearClase
      summary: Alta de clase (RF-06)
      description: Registra una clase con su tipo, instructor, rango horario (horarioInicio/horarioFin) y capacidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaseIn'
      responses:
        '201':
          description: Clase creada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/clases/4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaseOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClaseFueraDeHorario'
        '422':
          $ref: '#/components/responses/ValidationError'
  /clases/{claseId}:
    parameters:
      - $ref: '#/components/parameters/ClaseId'
    get:
      tags:
        - clases
      operationId: obtenerClase
      summary: Obtener clase por id
      description: Devuelve la clase con los cupos libres restantes ahora. Si no existe, 404.
      responses:
        '200':
          description: Clase encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaseOut'
        '404':
          $ref: '#/components/responses/NotFound'
  /clases/{claseId}/reservas:
    parameters:
      - $ref: '#/components/parameters/ClaseId'
    get:
      tags:
        - clases
      operationId: listarReservasDeClase
      summary: Listado de reservas de una clase
      description: >
        Ocupación de la clase. Sin `estado` devuelve solo las CONFIRMADA: las canceladas no aparecen en el listado y se piden con ?estado=CANCELADA (RF-12 conserva el histórico, no la visibilidad por
        defecto). Solo admite ?estado= y paginación (lista blanca de parámetros).
      parameters:
        - name: estado
          in: query
          required: false
          description: Estado persistido de la reserva (CONFIRMADA o CANCELADA). El estado efectivo CUMPLIDA se deriva de la fecha de la clase y se ve en la respuesta.
          schema:
            type: string
            enum:
              - CONFIRMADA
              - CANCELADA
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de reservas de la clase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaReservasClase'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reservas-canchas:
    get:
      tags:
        - reservas-canchas
      operationId: listarReservasCancha
      summary: Listado de reservas de cancha con filtros
      description: >
        Filtros por cancha, usuario, estado y día (lista blanca de parámetros) y paginación. Sin `estado` devuelve solo las CONFIRMADA activas (fecha_hora_fin futura): las canceladas no aparecen y se
        piden con ?estado=CANCELADA (RF-12 conserva el histórico), y las ya cumplidas con ?estado=CUMPLIDA (estado derivado de la fecha).
      parameters:
        - name: canchaId
          in: query
          required: false
          description: ID numérico de la cancha
          schema:
            type: integer
          example: 6
        - name: usuarioId
          in: query
          required: false
          description: ID numérico del usuario titular de la reserva
          schema:
            type: integer
          example: 1
        - name: estado
          in: query
          required: false
          description: Estado efectivo. Por defecto solo CONFIRMADA activas; CUMPLIDA se deriva de la fecha.
          schema:
            $ref: '#/components/schemas/EstadoReserva'
        - name: fecha
          in: query
          required: false
          description: Día consultado (YYYY-MM-DD, hora local de la sede).
          schema:
            type: string
            format: date
          example: '2026-09-16'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de reservas de cancha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaReservasCancha'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - reservas-canchas
      operationId: crearReservaCancha
      summary: Reservar un turno de cancha (RF-10, RN-02)
      description: >
        Crea la reserva de cancha en transacción. Si la cancha está EN_MANTENIMIENTO no se reservan turnos futuros sobre ella (RF-12): responde 409 sin tocar las reservas ya tomadas. Si dos usuarios
        reservan el mismo turno a la vez, el unique index parcial (unq_reserva_turno) hace que un solo INSERT gane y el otro reciba 409 problem+json. El precio aplicado se guarda en el momento de la
        reserva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCanchaIn'
      responses:
        '201':
          description: Reserva confirmada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/reservas-canchas/7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaCanchaOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictoReservaCancha'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reservas-canchas/{reservaCanchaId}:
    parameters:
      - $ref: '#/components/parameters/ReservaCanchaId'
    get:
      tags:
        - reservas-canchas
      operationId: obtenerReservaCancha
      summary: Obtener reserva de cancha por id
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaCanchaOut'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservas-canchas/{reservaCanchaId}/cancelaciones:
    parameters:
      - $ref: '#/components/parameters/ReservaCanchaId'
    post:
      tags:
        - reservas-canchas
      operationId: cancelarReservaCancha
      summary: Cancelar una reserva
      description: >
        Acción modelada como sub-recurso y sin body: responde 204 (la cancelación no lleva datos extra). El DELETE de reserva ES esta cancelación; no se borra el histórico. Solo puede cancelar una
        reserva CONFIRMADA cuyo turno no haya empezado: una reserva inexistente responde 404; una ya CANCELADA responde 409 `ReservaYaCancelada`; y una cuyo turno ya pasó (estado efectivo CUMPLIDA)
        responde 409 `ReservaPasada`. Para reprogramar se cancela y se reserva un turno nuevo.
      responses:
        '204':
          description: Reserva cancelada (sin cuerpo)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictoCancelacionReserva'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reservas-clases:
    get:
      tags:
        - reservas-clases
      operationId: listarReservasClase
      summary: Listado de reservas de clase con filtros
      description: >
        Filtros por clase, socio y estado (lista blanca de parámetros) y paginación. Sin `estado` devuelve solo las CONFIRMADA: las canceladas no aparecen en el listado y se piden explícitamente con
        ?estado=CANCELADA (RF-12 conserva el histórico, no la visibilidad por defecto).
      parameters:
        - name: claseId
          in: query
          required: false
          description: ID numérico de la clase
          schema:
            type: integer
          example: 4
        - name: socioId
          in: query
          required: false
          description: ID numérico del socio titular de la reserva
          schema:
            type: integer
          example: 2
        - name: estado
          in: query
          required: false
          description: Estado persistido de la reserva (CONFIRMADA o CANCELADA). El estado efectivo CUMPLIDA se deriva de la fecha de la clase y se ve en la respuesta.
          schema:
            type: string
            enum:
              - CONFIRMADA
              - CANCELADA
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de reservas de clase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaReservasClase'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - reservas-clases
      operationId: crearReservaClase
      summary: Reservar cupo en una clase
      description: >
        Registra la reserva de cupo (RF-06) y decrementa el cupo disponible. La ventana de reserva es de hasta 48 horas antes del inicio de la clase: fuera de esa ventana responde 409, igual que el
        cupo completo (RF-06) o una reserva duplicada. Un socio con cuotas vencidas responde 403: no puede reservar con tarifa bonificada. La cancelación del cupo se hace por el sub-recurso
        /cancelaciones (RF-07), no por DELETE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaClaseIn'
      responses:
        '201':
          description: Cupo reservado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/reservas-clases/5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaClaseOut'
        '403':
          $ref: '#/components/responses/SocioEnMora'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictoReservaClase'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reservas-clases/{reservaClaseId}:
    parameters:
      - $ref: '#/components/parameters/ReservaClaseId'
    get:
      tags:
        - reservas-clases
      operationId: obtenerReservaClase
      summary: Obtener reserva de cupo por id
      responses:
        '200':
          description: Reserva de cupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaClaseOut'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservas-clases/{reservaClaseId}/cancelaciones:
    parameters:
      - $ref: '#/components/parameters/ReservaClaseId'
    post:
      tags:
        - reservas-clases
      operationId: cancelarReservaClase
      summary: Cancelar un cupo de clase (RF-07)
      description: >
        Cancela un cupo confirmado. Hasta 2 horas antes del inicio de la clase la cancelación es sin penalidad. Dentro de esas 2 horas se permite igual, pero se cobra una penalidad del 50% del valor
        nominal de la clase (se registra como un Pago con concepto RESERVA_CLASE a nombre del socio que cancela). Una reserva inexistente responde 404; una ya cancelada se resuelve idempotente (204). Una
        reserva cuya clase ya comenzó (estado efectivo CUMPLIDA) responde 409 `ReservaClasePasada`. El cupo liberado se notifica a la lista de espera (RF-08) en la Unidad III.
      responses:
        '204':
          description: Cupo cancelado (sin cuerpo). Con menos de 2 hs de anticipación, se cobró la penalidad antes de liberar el cupo.
        '402':
          $ref: '#/components/responses/PagoRechazado'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReservaClasePasada'
  /clases/{claseId}/espera:
    parameters:
      - $ref: '#/components/parameters/ClaseId'
    get:
      tags:
        - clases
      operationId: listarEsperaDeClase
      summary: Listado de la lista de espera de una clase
      description: >
        Cola vigente de la clase. Sin `estado` devuelve solo los dos estados vivos, EN_ESPERA y NOTIFICADO: las anotaciones CONFIRMADO ya son reservas y las CANCELADO se excluyen del listado (RF-12
        conserva el histórico, no la visibilidad por defecto). Los excluidos se piden con ?estado=CONFIRMADO o ?estado=CANCELADO. Solo admite ?estado= y paginación (lista blanca de parámetros).
      parameters:
        - name: estado
          in: query
          required: false
          description: Estado de la anotación. Por defecto EN_ESPERA y NOTIFICADO.
          schema:
            $ref: '#/components/schemas/EstadoEspera'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de la lista de espera de la clase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaEsperas'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - esperas-clases
      operationId: anotarseEnEspera
      summary: Anotarse en la lista de espera de una clase (RF-08)
      description: >
        Anota al socio en la espera de la clase. Solo aplica si la clase está llena: con cupos disponibles no tiene sentido esperar y responde 409 (cupo-disponible). Un socio ya anotado o con reserva
        activa en la misma clase responde 409 (espera-existente), y una clase ya iniciada también (clase-pasada). Un socio con cuotas vencidas responde 403: no puede entrar a la espera de clases
        bonificadas. El registro nace en EN_ESPERA. Cuando se libera un cupo (RF-07) se notifica a todos los anotados y el primer confirmante obtiene la reserva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsperaIn'
      responses:
        '201':
          description: Anotado en la lista de espera
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/esperas-clases/10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsperaOut'
        '403':
          $ref: '#/components/responses/SocioEnMora'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictoEspera'
        '422':
          $ref: '#/components/responses/ValidationError'
  /esperas-clases:
    get:
      tags:
        - esperas-clases
      operationId: listarEsperasClase
      summary: Listado de anotaciones de espera con filtros
      description: >
        Filtros por clase, socio y estado (lista blanca de parámetros) y paginación. Sin `estado` devuelve solo los dos estados vivos, EN_ESPERA y NOTIFICADO: las CONFIRMADO ya son reservas y las
        CANCELADO no aparecen en el listado (RF-12 conserva el histórico, no la visibilidad por defecto).
      parameters:
        - name: claseId
          in: query
          required: false
          description: ID numérico de la clase
          schema:
            type: integer
          example: 4
        - name: socioId
          in: query
          required: false
          description: ID numérico del socio anotado
          schema:
            type: integer
          example: 2
        - name: estado
          in: query
          required: false
          description: Estado de la anotación. Por defecto EN_ESPERA y NOTIFICADO.
          schema:
            $ref: '#/components/schemas/EstadoEspera'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de anotaciones de espera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaEsperas'
        '422':
          $ref: '#/components/responses/ValidationError'
  /esperas-clases/{esperaId}:
    parameters:
      - $ref: '#/components/parameters/EsperaId'
    get:
      tags:
        - esperas-clases
      operationId: obtenerEspera
      summary: Obtener anotación de espera por id
      responses:
        '200':
          description: Anotación de espera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsperaOut'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - esperas-clases
      operationId: salirDeEspera
      summary: Salir de la lista de espera (baja lógica)
      description: >
        Baja lógica: la anotación pasa a CANCELADO (no se borra el registro; se conserva el histórico de la espera). Una anotación CONFIRMADA ya tomó el cupo: no se puede salir así; su reserva se
        gestiona por /reservas-clases (RF-07). Responder 409.
      responses:
        '204':
          description: Anotación cancelada (sin cuerpo)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EsperaConfirmada'
  /esperas-clases/{esperaId}/confirmaciones:
    parameters:
      - $ref: '#/components/parameters/EsperaId'
    post:
      tags:
        - esperas-clases
      operationId: confirmarEspera
      summary: Confirmar cupo desde la lista de espera (RF-08)
      description: >
        Materializa el first-come: el cupo liberado lo toma el primer anotado en NOTIFICADO que confirme; al confirmar se crea la ReservaClase y la anotación pasa a CONFIRMADO. Solo confirma quien
        está NOTIFICADO: si la anotación no fue notificada o el cupo ya lo tomó otro socio responde 409. La notificación en sí la emite el servidor (observer, no es un endpoint): este POST solo
        registra la decisión del socio. Devuelve 201 con la ReservaClase creada y Location: el id de la reserva es el dato que el socio necesita para referenciarla, y se obtiene en la misma respuesta
        en lugar de barrer GET /reservas-clases.
      responses:
        '201':
          description: Cupo confirmado y ReservaClase creada
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
                example: /api/v1/reservas-clases/5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaClaseOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConfirmacionRechazada'
  /pagos:
    get:
      tags:
        - pagos
      operationId: listarPagos
      summary: Listado de pagos con filtros
      description: >
        Filtros por usuario, estado, tipo de concepto, concepto concreto y período (lista blanca de parámetros) y paginación. Sin `estado` devuelve solo los APROBADO: es el único estado en el que el
        dinero se movió y existe comprobante. PENDIENTE, RECHAZADO y ANULADO se piden explícitamente con ?estado=, porque un pago anulado no se borra del histórico: se repaga con una nueva
        Idempotency-Key. `tipo` es el discriminante de ConceptoPago (RESERVA_CANCHA cruza con PagoReserva, MEMBRESIA con PagoMembresia). `desde` y `hasta` son días (YYYY-MM-DD) en hora local y forman
        un intervalo cerrado: ?desde=2026-03-01&hasta=2026-03-31 trae todo marzo.
      parameters:
        - name: usuarioId
          in: query
          required: false
          description: ID numérico del usuario que pagó
          schema:
            type: integer
          example: 1
        - name: estado
          in: query
          required: false
          description: Estado del pago. Sin este parámetro devuelve solo los APROBADO.
          schema:
            $ref: '#/components/schemas/EstadoPago'
        - name: tipo
          in: query
          required: false
          description: Discriminante del concepto cobrado.
          schema:
            type: string
            enum:
              - RESERVA_CANCHA
              - MEMBRESIA
              - RESERVA_CLASE
            example: RESERVA_CANCHA
        - name: reservaCanchaId
          in: query
          required: false
          description: Solo pagos cuyo concepto es una reserva de esta cancha (PagoReserva.reserva_id).
          schema:
            type: integer
          example: 7
        - name: membresiaId
          in: query
          required: false
          description: Solo pagos cuyo concepto es esta membresía (PagoMembresia.membresia_id); una membresía admite varios pagos por renovación.
          schema:
            type: integer
          example: 3
        - name: reservaClaseId
          in: query
          required: false
          description: Solo pagos cuyo concepto es una reserva de clase (PagoReservaClase.reserva_clase_id); penalidad por cancelación tardía (RF-07).
          schema:
            type: integer
          example: 4
        - name: desde
          in: query
          required: false
          description: Inicio del intervalo, inclusivo (YYYY-MM-DD, hora local).
          schema:
            type: string
            format: date
          example: '2026-03-01'
        - name: hasta
          in: query
          required: false
          description: Fin del intervalo, inclusivo (YYYY-MM-DD, hora local).
          schema:
            type: string
            format: date
          example: '2026-03-31'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado de pagos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPagos'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - pagos
      operationId: procesarPago
      summary: Procesar un pago (RF-13)
      description: >
        Cobro de una reserva de cancha (PagoReserva) o una renovación de membresía (PagoMembresia). Requiere la cabecera Idempotency-Key: si la clave ya fue usada, el unique del esquema responde 409 y
        la pasarela no se invoca de nuevo. El monto lo computa la regla de negocio (por precio aplicado o plan). Sin PATCH/DELETE: un cobro mal hecho se ANULA por POST /pagos/{pagoId}/anulaciones y
        se repaga con una nueva Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagoIn'
      responses:
        '201':
          description: Pago procesado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/pagos/8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoOut'
        '400':
          $ref: '#/components/responses/MissingIdempotency'
        '402':
          $ref: '#/components/responses/PagoRechazado'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotenciaRepetida'
        '422':
          $ref: '#/components/responses/ValidationError'
  /pagos/{pagoId}:
    parameters:
      - $ref: '#/components/parameters/PagoId'
    get:
      tags:
        - pagos
      operationId: obtenerPago
      summary: Obtener pago por id
      responses:
        '200':
          description: Pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoOut'
        '404':
          $ref: '#/components/responses/NotFound'
  /pagos/{pagoId}/comprobante:
    parameters:
      - $ref: '#/components/parameters/PagoId'
    get:
      tags:
        - pagos
      operationId: obtenerComprobante
      summary: Descargar comprobante PDF (RF-14)
      description: |
        Genera/retorna el comprobante del pago aprobado (snapshot al momento del pago). Si el pago no fue aprobado (PENDIENTE/RECHAZADO/ANULADO) responde 409.
      responses:
        '200':
          description: Comprobante en PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PagoNoAprobado'
  /pagos/{pagoId}/anulaciones:
    parameters:
      - $ref: '#/components/parameters/PagoId'
    post:
      tags:
        - pagos
      operationId: anularPago
      summary: Anular un pago
      description: >
        Única forma de mover un pago hacia ANULADO (sin PATCH ni DELETE). Aplica a un pago PENDIENTE o APROBADO (por ej. cobro duplicado o mal hecho). Re-anular un pago ya ANULADO es idempotente:
        responde 204 sin cambios. Un pago RECHAZADO nunca se cobró y no es anulable: responde 409. El pago anulado no se borra del histórico: se repaga con una nueva Idempotency-Key.
      responses:
        '204':
          description: Pago anulado (sin cuerpo)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PagoNoAnulable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reportes/pagos:
    get:
      tags:
        - reportes
      operationId: reporteIngresos
      summary: Reporte de ingresos por período (PDF)
      description: >
        Consolidado en PDF de los pagos APROBADO, agrupado por día local de la sede, sede y tipo de concepto, con total por fila y total general. `desde` y `hasta` son días (YYYY-MM-DD) en hora local y forman un intervalo cerrado; sin ellos es histórico. Solo GERENTE.
      security:
        - bearer: []
      parameters:
        - name: desde
          in: query
          required: false
          description: Inicio del período, inclusivo (YYYY-MM-DD, hora local de la sede).
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: hasta
          in: query
          required: false
          description: Fin del período, inclusivo (YYYY-MM-DD, hora local de la sede).
          schema:
            type: string
            format: date
          example: '2026-10-31'
      responses:
        '200':
          description: Reporte en PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: Rol sin permiso (solo GERENTE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      description: ID numérico del usuario
      schema:
        type: integer
        example: 1
    SocioId:
      name: socioId
      in: path
      required: true
      description: ID numérico del socio
      schema:
        type: integer
        example: 2
    SedeId:
      name: sedeId
      in: path
      required: true
      description: ID numérico de la sede
      schema:
        type: integer
        example: 3
    ReservaClaseId:
      name: reservaClaseId
      in: path
      required: true
      description: ID numérico de la reserva de clase
      schema:
        type: integer
        example: 5
    CanchaId:
      name: canchaId
      in: path
      required: true
      description: ID numérico de la cancha
      schema:
        type: integer
        example: 6
    ReservaCanchaId:
      name: reservaCanchaId
      in: path
      required: true
      description: ID numérico de la reserva de cancha
      schema:
        type: integer
        example: 7
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única de idempotencia (el reintento con la misma clave no duplica el cobro).
      schema:
        type: string
        example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
    PagoId:
      name: pagoId
      in: path
      required: true
      description: ID numérico del pago
      schema:
        type: integer
        example: 8
    ClaseId:
      name: claseId
      in: path
      required: true
      description: ID numérico de la clase
      schema:
        type: integer
        example: 4
    IngresoId:
      name: ingresoId
      in: path
      required: true
      description: ID numérico del ingreso
      schema:
        type: integer
        example: 9
    EsperaId:
      name: esperaId
      in: path
      required: true
      description: ID numérico de la anotación en la lista de espera
      schema:
        type: integer
        example: 10
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ListaUsuarios:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioOut'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaSocios:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SocioOut'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaSedes:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SedeOut'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaIngresos:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngresoOut'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaCanchas:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CanchaOut'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaDisponibilidad:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisponibilidadEntrada'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaClases:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClaseOut'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaReservasClase:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservaClaseOut'
        total:
          type: integer
          description: Cantidad total que cumple el filtro, sin paginar.
          example: 42
    ListaReservasCancha:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservaCanchaOut'
        total:
          type: integer
