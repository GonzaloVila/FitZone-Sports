# nginx para la SPA de FitZone Sports.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas del router de Vue (/socios, /canchas/2/turnos, …): si no es un archivo, se sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos con hash en el nombre no cambian nunca: caché larga.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El shell, el service worker y el manifest se revalidan siempre: así la PWA toma cada versión nueva.
  location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
}
